<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard — Voleibol</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="btn btn-sm home-link" href="/" title="Voltar à lista de jogos">← Jogos</a>
    <b>Dashboard</b>
    <span class="conn" id="conn"></span>
    <span class="spacer"></span>
    <a class="link" id="lnk-live" href="#">Direto</a>
    <a class="link" id="lnk-xlsx" href="#">Excel</a>
    <a class="link" id="lnk-pdf" href="#" target="_blank">Relatório PDF</a>
  </header>
  <main class="wrap" id="dash"><p class="muted">A carregar…</p></main>

  <script type="module">
    import { $, param, subscribe, requireLogin, isAdmin } from '/js/common.js';
    import { createDashboard, workbookSheets } from '/js/dashboard.js';
    import { buildXlsx, download } from '/js/xlsx.js';

    const id = param('id');
    if (!id) location.href = '/';
    const user = await requireLogin();
    $('#lnk-live').href = `/live.html?id=${id}`;
    const dash = createDashboard($('#dash'));
    let current;
    subscribe(id, (m) => {
      // só os utilizadores do escalão do jogo (e o administrador)
      if (!isAdmin(user) && !user.categories.includes(m.category)) {
        $('#dash').innerHTML = '<section class="card"><h2>Sem acesso</h2><p>Este jogo é de um escalão a que não pertence.</p></section>';
        return;
      }
      current = m; dash.update(m);
    }, (ok) => {
      $('#conn').textContent = ok ? '' : '● sem ligação';
      $('#conn').classList.toggle('off', !ok);
    });

    // exportação para Excel (.xlsx) e relatório para PDF
    const safe = (t) => t.replace(/[\\/:*?"<>|]+/g, ' ').trim();
    $('#lnk-xlsx').onclick = (e) => {
      e.preventDefault();
      if (!current) return;
      const name = safe(`estatisticas ${current.teams.A.name} vs ${current.teams.B.name}${current.date ? ' ' + current.date : ''}`);
      download(buildXlsx(workbookSheets(current)), `${name}.xlsx`);
    };
    $('#lnk-pdf').href = `/report.html?id=${id}`;
  </script>
</body>
</html>
