<!DOCTYPE html>
<html lang="pt" class="report">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório — Voleibol</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* o relatório é sempre claro, também com o tema escuro do sistema */
    :root.report {
      color-scheme: light;
      --bg: #e9e9e6; --surface-1: #ffffff; --surface-2: #f2f2ef; --border: #dcdcd6; --grid: #ebebe7;
      --text-primary: #111; --text-secondary: #4d4c49; --text-muted: #85847e;
      --team-a: #2a78d6; --team-b: #eb6834; --team-a-soft: #2a78d61f; --team-b-soft: #eb68341f;
      --good: #1a7f37; --bad: #c62828; --shadow: none;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { font-size: 13px; }
    .toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: .5rem; align-items: center; justify-content: center; padding: .6rem; background: var(--surface-1); border-bottom: 1px solid var(--border); }
    .toolbar .hint { color: var(--text-muted); font-size: .8rem; }
    .page { width: 210mm; max-width: 100%; margin: 1rem auto; background: var(--surface-1); padding: 14mm 13mm; box-shadow: 0 2px 12px #0002; }

    .hero { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; padding-bottom: 5mm; border-bottom: 3px solid var(--text-primary); }
    .hero .team { font-size: 1.35rem; font-weight: 800; line-height: 1.15; }
    .hero .team.B { text-align: right; }
    .hero .team small { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: .2rem; }
    .hero .sets { font-size: 2.6rem; font-weight: 800; letter-spacing: .02em; text-align: center; line-height: 1; }
    .hero .sets .A { color: var(--team-a); } .hero .sets .B { color: var(--team-b); }
    .hero .res { display: block; text-align: center; font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-top: .35rem; color: var(--text-secondary); }
    .meta { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: 3mm 0 0; color: var(--text-secondary); font-size: .8rem; }
    .meta .set-history { margin: 0; justify-content: flex-end; }

    .rsec { margin-top: 6mm; break-inside: avoid; }
    .rsec > h2 { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border); padding-bottom: 1.5mm; margin-bottom: 3mm; }
    .rsec h3 { font-size: .78rem; margin: 0 0 .3rem; }
    .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; }
    .cols2 > div { break-inside: avoid; }
    .kpis { grid-template-columns: repeat(4, 1fr); gap: 2.5mm; }
    .kpi { padding: .55rem .6rem; border-radius: 8px; }
    .kpi .v { font-size: 1.3rem; }
    .brow { grid-template-columns: 7.5rem 1fr 4.8rem; padding: .12rem 0; }
    .brow .track { height: 9px; }
    .highlights { grid-template-columns: repeat(5, 1fr); gap: 2.5mm; }
    .hl { padding: .5rem; border-radius: 8px; } .hl .val { font-size: 1.05rem; }
    .table-wrap { overflow: visible; }
    table.stats { font-size: 9.5px; }
    table.stats th { position: static; cursor: default; white-space: normal; vertical-align: bottom; font-size: 8.5px; }
    table.stats th.sorted::after { content: ""; }
    table.stats th, table.stats td { padding: .22rem .3rem; }
    table.stats td.name { position: static; }
    .multiples { grid-template-columns: repeat(3, 1fr); gap: 4mm; }
    .chart h3 { font-size: .75rem; }
    .foot { margin-top: 8mm; padding-top: 2mm; border-top: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--text-muted); font-size: .7rem; }

    @page { size: A4; margin: 10mm; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .page { width: auto; margin: 0; padding: 0; box-shadow: none; }
    }
    @media (max-width: 700px) {
      .page { padding: 1rem; } .cols2 { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: repeat(2, 1fr); } .highlights { grid-template-columns: repeat(2, 1fr); }
      .multiples { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn-primary" id="btn-print">Imprimir / Guardar como PDF</button>
    <span class="hint">No diálogo de impressão, escolha “Guardar como PDF”.</span>
  </div>
  <main class="page" id="report"><p class="muted">A carregar…</p></main>

  <script type="module">
    import { $, esc, api, param, requireLogin, isAdmin, fmtDuration, setHistoryHTML } from '/js/common.js';
    import { computeState, computeStats, derived, pct, ZONES } from '/js/engine.js';
    import { setChartHTML, setTarget, playerTableHTML, roleTableHTML, kpiHTML, barsHTML, highlightsHTML, TABLES, active } from '/js/dashboard.js';

    const id = param('id');
    if (!id) location.href = '/';
    const user = await requireLogin();
    $('#btn-print').onclick = () => window.print();

    const fmtPct = (v) => (v == null ? '—' : `${v}%`);
    const fmtRatio = (r) => (r.tot ? `${r.won}/${r.tot}` : '—');

    function render(match) {
      const state = computeState(match);
      const st = computeStats(match, state);
      const T = st.teams.A, d = derived(T), rc = T.reception, dg = T.dig;
      const so = T.sideout, bp = T.breakpoint, ar = T.afterReception;
      const conceded = Object.values(T.conceded).reduce((a, b) => a + b, 0);
      const evs = match.events;
      const duration = evs.length > 1 ? fmtDuration(evs.at(-1).t - evs[0].t) : null;
      const res = state.finished ? (state.winner === 'A' ? 'Vitória' : 'Derrota') : evs.length ? 'Jogo em curso' : 'Por começar';
      const played = state.sets.map((s, i) => [s, i]).filter(([s]) => s.rallies.length);
      const hasRot = Object.values(T.byRotation).some((r) => r.so.tot + r.bp.tot);
      // nas tabelas só entram as jogadoras com ações registadas
      const inPlay = st.players.A.filter(active);
      const benched = st.players.A.filter((p) => !active(p));
      const cur = state.sets[state.currentSet];
      const resLine = !state.finished && cur?.rallies.length ? `${res} · set ${state.currentSet + 1}: ${cur.A}–${cur.B}` : res;
      document.title = `Relatório — ${match.teams.A.name} vs ${match.teams.B.name}${match.date ? ` (${match.date})` : ''}`;

      $('#report').innerHTML = `
        <header class="hero">
          <div class="team A"><small>${esc(match.categoryName || 'A nossa equipa')}</small>${esc(match.teams.A.name)}</div>
          <div><div class="sets"><span class="A">${state.setsWon.A}</span>–<span class="B">${state.setsWon.B}</span></div><span class="res">${resLine}</span></div>
          <div class="team B"><small>Adversário</small>${esc(match.teams.B.name)}</div>
        </header>
        <div class="meta">
          <span>${[match.title, match.date, match.venue, duration && `Duração ${duration}`].filter(Boolean).map(esc).join(' · ')}</span>
          ${setHistoryHTML(state)}
        </div>

        <section class="rsec">
          <h2>Indicadores da equipa</h2>
          <div class="kpis">
            ${kpiHTML('Side-out (em receção)', fmtPct(pct(so.won, so.tot)), `${fmtRatio(so)} pontos`)}
            ${kpiHTML('Break-point (no serviço)', fmtPct(pct(bp.won, bp.tot)), `${fmtRatio(bp)} pontos`)}
            ${kpiHTML('Média de receção', d.recAvg ?? '—', `escala 0–3 · ${rc.tot} receções`)}
            ${kpiHTML('Receção positiva', fmtPct(d.recPositive), `perfeita ${fmtPct(d.recPerfect)}`)}
            ${kpiHTML('Eficácia de ataque', fmtPct(d.attackEff), `${T.attack.kill} pontos em ${T.attack.tot}`)}
            ${kpiHTML('Ases / erros de serviço', `${T.serve.ace} / ${T.serve.err}`, `${T.serve.tot} serviços`)}
            ${kpiHTML('Defesas boas', fmtPct(d.digPositive), `${dg.good} de ${dg.tot} defesas`)}
            ${kpiHTML('Bloco', T.block.pts, `pontos · ${T.block.touch} toques`)}
          </div>
        </section>

        <section class="rsec cols2">
          <div>
            <h2>Pontos ganhos (${T.totalPoints})</h2>
            ${barsHTML([
              { label: 'Ataque', value: T.from.attack, of: T.totalPoints },
              { label: 'Bloco', value: T.from.block, of: T.totalPoints },
              { label: 'Ás', value: T.from.serve, of: T.totalPoints },
              { label: 'Erros adversário', value: T.from.oppError, of: T.totalPoints },
              { label: 'Outros', value: T.from.other, of: T.totalPoints },
            ], 'A')}
          </div>
          <div>
            <h2>Pontos sofridos (${conceded})</h2>
            ${barsHTML([
              { label: 'Ataque adversário', value: T.conceded.attack, of: conceded },
              { label: 'Ás', value: T.conceded.ace, of: conceded },
              { label: 'Bloco adversário', value: T.conceded.block, of: conceded },
              { label: 'Erros nossos', value: T.conceded.ownError, of: conceded },
              { label: 'Outros', value: T.conceded.other, of: conceded },
            ], 'B')}
          </div>
        </section>

        <section class="rsec cols2">
          <div>
            <h2>Receção</h2>
            ${barsHTML([
              { label: 'Perfeita', value: rc.perfect, of: rc.tot },
              { label: 'Boa', value: rc.good, of: rc.tot },
              { label: 'Má', value: rc.poor, of: rc.tot },
              { label: 'Erro / Ás', value: rc.err, of: rc.tot },
            ], 'A')}
            <h3 style="margin-top:.7rem">Side-out conforme a receção</h3>
            ${barsHTML([
              { label: 'Após perfeita', value: pct(ar.perfect.won, ar.perfect.tot) },
              { label: 'Após boa', value: pct(ar.good.won, ar.good.tot) },
              { label: 'Após má', value: pct(ar.poor.won, ar.poor.tot) },
            ], 'A', { pctScale: true })}
          </div>
          <div>
            <h2>Ataque e defesa</h2>
            ${barsHTML([
              { label: 'Ataque: ponto', value: T.attack.kill, of: T.attack.tot },
              { label: 'Ataque: erro', value: T.attack.err, of: T.attack.tot },
              { label: 'Ataque: bloqueado', value: T.attack.blk, of: T.attack.tot },
            ], 'A')}
            <h3 style="margin-top:.7rem">Defesas</h3>
            ${barsHTML([
              { label: 'Boa', value: dg.good, of: dg.tot },
              { label: 'Má', value: dg.poor, of: dg.tot },
              { label: 'Erro / sem toque', value: dg.err, of: dg.tot },
            ], 'A')}
          </div>
        </section>

        ${hasRot ? `<section class="rsec cols2">
          <div>
            <h2>Side-out por rotação</h2>
            ${barsHTML(ZONES.map((z) => ({ label: `R${z} (${fmtRatio(T.byRotation[z].so)})`, value: pct(T.byRotation[z].so.won, T.byRotation[z].so.tot) })), 'A', { pctScale: true })}
          </div>
          <div>
            <h2>Break-point por rotação</h2>
            ${barsHTML(ZONES.map((z) => ({ label: `R${z} (${fmtRatio(T.byRotation[z].bp)})`, value: pct(T.byRotation[z].bp.won, T.byRotation[z].bp.tot) })), 'A', { pctScale: true })}
          </div>
        </section>` : ''}

        <section class="rsec">
          <h2>Destaques</h2>
          ${highlightsHTML(st)}
        </section>

        ${played.length ? `<section class="rsec">
          <h2>Evolução do marcador</h2>
          <div class="legend"><span><i class="A"></i>${esc(match.teams.A.name)}</span><span><i class="B"></i>${esc(match.teams.B.name)}</span></div>
          <div class="multiples">${played.map(([s, i]) => setChartHTML(match, s, i, setTarget(match, i))).join('')}</div>
        </section>` : ''}

        ${['rec', 'def', 'atk'].map((t) => `<section class="rsec">
          <h2>${TABLES[t].title}</h2>
          ${inPlay.length ? playerTableHTML(t, inPlay, T, TABLES[t].sort) : '<p class="muted">Ainda sem ações registadas com jogador.</p>'}
        </section>`).join('')}
        ${benched.length ? `<p class="small muted">Sem ações registadas: ${benched.map((p) => `#${p.number} ${esc(p.name || '')}`).join(', ')}.</p>` : ''}
        <section class="rsec">
          <h2>Por posição</h2>
          ${roleTableHTML(T.byRole)}
        </section>

        <footer class="foot">
          <span>${esc(match.teams.A.name)} vs ${esc(match.teams.B.name)}${match.date ? ` · ${esc(match.date)}` : ''}</span>
          <span>Relatório gerado em ${new Date().toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' })}</span>
        </footer>`;
    }

    try {
      const m = await api(`matches/${id}`);
      if (!isAdmin(user) && !user.categories.includes(m.category)) {
        $('#report').innerHTML = '<h2>Sem acesso</h2><p>Este jogo é de um escalão a que não pertence.</p>';
      } else {
        render(m);
      }
    } catch (e) {
      $('#report').innerHTML = `<p class="muted">Erro a carregar o jogo: ${esc(e.message)}</p>`;
    }
  </script>
</body>
</html>
